[project]
name = "atom1"
version = "0.2.0"
description = "Atom — joins Google Meet, records audio + video, returns an MP4"
requires-python = ">=3.11"
dependencies = [
    # Web server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Browser automation (joins + records the meeting)
    "playwright>=1.49.0",

    # Google sign-in verification
    "google-auth>=2.30.0",

    # S3 upload for recordings
    "boto3>=1.34.0",

    # Config / utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
